<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder Kid</title>
    <style>
        body{
            background-color: rgb(251, 251, 173);
            color: rgb(128, 0, 0);
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        #heading{
            font-size: 60px;
            color: rgb(255, 255, 0);
            text-shadow: 3px 5px black;
        }
        #tagline{
            font-style: oblique;
            color: blue;
        }
        .superpowers{
            text-transform: uppercase;
            text-decoration: underline overline;
            color: midnightblue;
        }
        .power{
            color: blueviolet;
        }
        .Weakness{
            text-decoration: line-through;
            color: cadetblue;
        }
        .badge{
            color: gold;
            transform: rotate(15deg);
            margin:100px 50px 50px;
            font-size: 30px;
        }
        .MADE-BY{
            color: crimson;
            font-style: italic
        }
        #heading:hover{
            color: white;
            text-transform: uppercase;
            background-color:yellow ;
        }
    </style>
</head>
<body>
    <h1 id="heading">Thunder Kid</h1>
    <p id="tagline">The most powerful hero in the school</p>
    <h2 class="superpowers">Superpowers</h2>
    <p class="power">Super speed- Can run faster than a cheetah</p>
    <p class="power">Superhuman strength- Can lift a truck </p>
    <h2 class="superpowers">Weaknesses</h2>
    <p class="Weakness">English homework</p>
    <p class="Weakness">Green vegetables</p>
    <p class="badge">Top hero</p>
    <p class="MADE-BY">Created by: Neil</p>
</body>
</html>
